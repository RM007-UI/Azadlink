name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Keep only the newest build for a branch; cancel superseded runs.
concurrency:
  group: azadlink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Adapt upstream library to the stable Android SDK in CI
        shell: bash
        run: |
          # The pinned upstream currently declares preview API 37. AzadLink only
          # needs stable API 35 for this integration, so patch the checked-out
          # submodule build script in the ephemeral CI workspace only.
          sed -i 's/compileSdk = 37/compileSdk = 35/; /compileSdkMinor = 0/d' oblivion-upstream/android/aether-vpn/build.gradle.kts
      - name: Verify pinned Aether and TUN bridge sources are present
        shell: bash
        run: |
          set -euo pipefail
          test -f oblivion-upstream/android/aether-vpn/src/main/kotlin/org/bepass/oblivion/vpn/AetherVpnService.kt
          test -f oblivion-upstream/android/aether-vpn/src/main/kotlin/org/bepass/oblivion/vpn/TunnelBundle.kt
          test -f oblivion-upstream/aetherproject/aether/Cargo.toml
      - name: Keep Psiphon startup diagnostics visible in device logs
        shell: bash
        run: |
          set -euo pipefail
          # The upstream core logs unstructured ConsoleClient stderr at debug level.
          # Android builds run at info level, which hides the actual early-exit reason.
          sed -i 's/log::debug!("\[psiphon\] {line}");/log::warn!("[psiphon] {line}");/g' oblivion-upstream/aetherproject/aether/src/psiphon.rs
          test -f oblivion-upstream/android/aether-vpn/src/main/jni/hev-socks5-tunnel/Android.mk
          echo "Pinned upstream Aether, Rust core, and hev TUN bridge sources are present."
      - name: Preserve upstream license notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/licenses
          cp oblivion-upstream/LICENSE app/src/main/assets/licenses/Oblivion-LICENSE.txt
          cp oblivion-upstream/aetherproject/LICENSE app/src/main/assets/licenses/Aether-LICENSE.txt
          cp oblivion-upstream/android/aether-vpn/src/main/jni/hev-socks5-tunnel/LICENSE app/src/main/assets/licenses/hev-socks5-tunnel-LICENSE.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install Android platform and NDK
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;29.0.13846066'
      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build Xray gomobile AAR from source (TUN, MASQUE and WireGuard outbound)
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/AndroidLibXrayLite"
          git clone --depth 1 --branch main https://github.com/2dust/AndroidLibXrayLite.git "$src"
          cd "$src"
          mkdir -p "$GITHUB_WORKSPACE/app/libs" "$GITHUB_WORKSPACE/app/src/main/assets/licenses" assets data
          bash gen_assets.sh download
          cp -v data/*.dat assets/
          go mod tidy -v
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" ./
          cp LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/licenses/AndroidLibXrayLite-LICENSE.txt"
          core_dir="$(go list -m -f '{{.Dir}}' github.com/xtls/xray-core)"
          if [[ -f "$core_dir/LICENSE" ]]; then cp "$core_dir/LICENSE" "$GITHUB_WORKSPACE/app/src/main/assets/licenses/Xray-core-MPL-2.0.txt"; fi
          if [[ -f "$core_dir/NOTICE" ]]; then cp "$core_dir/NOTICE" "$GITHUB_WORKSPACE/app/src/main/assets/licenses/Xray-core-NOTICE.txt"; fi
          printf 'Repository: https://github.com/2dust/AndroidLibXrayLite\nBuilt from CI source checkout\n' > "$GITHUB_WORKSPACE/app/src/main/assets/core-runtime-version.txt"
      # Keep Psiphon aligned with the exact fork/revision used by Aether's
      # upstream psiphon-build.sh. The stock v2.0.41 binary rejects protocol IDs
      # emitted by this Aether core; its TLS unsafe layout also caused startup panics.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false
      - name: Build Aether-compatible Psiphon ConsoleClient
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/psiphon-tunnel-core"
          git clone --depth 50 --branch shirokhorshid https://github.com/CluvexStudio/psiphon-tunnel-core.git "$src"
          git -C "$src" checkout --quiet 83aa73b9b982e7421e00117f5b0c5aceb5dda452
          # Guard against accidentally bundling a stale/stock source tree whose protocol list
          # does not match the Aether-generated LimitTunnelProtocols values.
          grep -Fq 'TUNNEL_PROTOCOL_FRONTED_MEEK_CDN' "$src/psiphon/common/protocol/protocol.go"
          grep -Fq 'go 1.26.0' "$src/go.mod"
          test "$(go version | awk '{print $3}')" = 'go1.26.3'
          # Fail the build if the exact protocol reported invalid on-device is not
          # accepted by the exact Psiphon source revision being bundled.
          cat > "$src/verify_azadlink_protocols.go" <<'GO'
          package main
          import (
            "fmt"
            "github.com/Psiphon-Labs/psiphon-tunnel-core/psiphon/common/protocol"
          )
          func main() {
            err := (protocol.TunnelProtocols{"FRONTED-MEEK-CDN-OSSH"}).Validate()
            if err != nil { panic(err) }
            fmt.Println("AzadLink Psiphon protocol compatibility verified")
          }
          GO
          (cd "$src" && GOFLAGS=-mod=vendor go run verify_azadlink_protocols.go)
          tls_version="v0.0.0-20260429174135-190516348878"
          grep -Fq "# github.com/Psiphon-Labs/psiphon-tls $tls_version" "$src/vendor/modules.txt"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/licenses
          printf 'Psiphon source commit: 83aa73b9b982e7421e00117f5b0c5aceb5dda452\nPsiphon TLS module: %s\nProtocol validation: passed\n' "$tls_version" > app/src/main/assets/psiphon-runtime-version.txt
          # Aether's own build script targets Linux/arm64 with pure Go (no cgo).
          # Android shares the Linux arm64 syscall ABI, and the core executes this file
          # as a child process; it is not loaded as a JNI shared library.
          (cd "$src" && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 GOFLAGS=-mod=vendor go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpsiphon.so" ./ConsoleClient)
          cp "$src/LICENSE" app/src/main/assets/licenses/Psiphon-GPL-3.0.txt
      # Restore the toolchain used by the other Go-based cores.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build MasterDNS, StormDNS and DNSTT Android executables
        shell: bash
        run: |
          set -euo pipefail
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          out="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$out" app/src/main/assets/licenses
          build_client() {
            local repo="$1" ref="$2" package="$3" name="$4"
            local src="$RUNNER_TEMP/$name"
            git clone --depth 1 --branch "$ref" "$repo" "$src"
            (cd "$src" && GOOS=android GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o "$out/$name.so" "$package")
            if [[ -f "$src/LICENSE" ]]; then cp "$src/LICENSE" "app/src/main/assets/licenses/$name-LICENSE.txt"; fi
          }
          build_client https://github.com/masterking32/MasterDnsVPN.git main ./cmd/client libazadlink_masterdns
          build_client https://github.com/nullroute1970/StormDNS.git main ./cmd/client libazadlink_stormdns
          build_client https://github.com/mahsanet/dnstt.git master ./cmd/dnstt-client libazadlink_dnstt
      - name: Run unit tests and assemble debug APK
        run: gradle -PaetherAbi=arm64-v8a testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: azadlink-debug-apk-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Detect release signing configuration
        id: signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          AZADLINK_KEYSTORE_BASE64: ${{ secrets.AZADLINK_KEYSTORE_BASE64 }}
          AZADLINK_STORE_PASSWORD: ${{ secrets.AZADLINK_STORE_PASSWORD }}
          AZADLINK_KEY_ALIAS: ${{ secrets.AZADLINK_KEY_ALIAS }}
          AZADLINK_KEY_PASSWORD: ${{ secrets.AZADLINK_KEY_PASSWORD }}
          AZADLINK_STABLE_RELEASE_REQUEST: ${{ github.event.head_commit.message == 'Publish AzadLink v0.10.0 stable release' }}
        run: |
          set -euo pipefail
          present=0
          for name in AZADLINK_KEYSTORE_BASE64 AZADLINK_STORE_PASSWORD AZADLINK_KEY_ALIAS AZADLINK_KEY_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" == "0" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* || "$AZADLINK_STABLE_RELEASE_REQUEST" == "true" ]]; then
              echo "::error::A stable release requires the persistent signing keystore secrets."
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No release-signing secrets found; publishing the debug artifact only."
          elif [[ "$present" == "4" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "All release-signing inputs are present."
          else
            echo "::error::Release signing secrets are only partially configured ($present of 4)."
            exit 1
          fi
      - name: Build signed release APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          AZADLINK_KEYSTORE_BASE64: ${{ secrets.AZADLINK_KEYSTORE_BASE64 }}
          AZADLINK_STORE_PASSWORD: ${{ secrets.AZADLINK_STORE_PASSWORD }}
          AZADLINK_KEY_ALIAS: ${{ secrets.AZADLINK_KEY_ALIAS }}
          AZADLINK_KEY_PASSWORD: ${{ secrets.AZADLINK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in AZADLINK_KEYSTORE_BASE64 AZADLINK_STORE_PASSWORD AZADLINK_KEY_ALIAS AZADLINK_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure the stable release keystore before tagging a release."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/azadlink-release.jks"
          printf '%s' "$AZADLINK_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "AZADLINK_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          export AZADLINK_KEYSTORE_PATH="$keystore"
          gradle -PaetherAbi=arm64-v8a assembleRelease
      - name: Upload signed APK as workflow artifact
        if: github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: azadlink-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish signed APK to GitHub Release
        if: >-
          github.event_name != 'pull_request' &&
          steps.signing.outputs.enabled == 'true' &&
          (
            startsWith(github.ref, 'refs/tags/v') ||
            (
              github.ref == 'refs/heads/feature/aether-masque-autoconnect' &&
              github.event_name == 'push' &&
              github.event.head_commit.message == 'Publish AzadLink v0.10.0 stable release'
            )
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.10.0' }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          name: AzadLink v0.10.0 · Stable
          body: |
            AzadLink ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.10.0' }} stable release.

            Includes the redesigned side drawer, protocol configuration management, app-routing and proxy settings, localized interface options, refined notification icon, and Aether MASQUE HTTP/2 defaults.

            GitHub Actions builds the signed APK and runs unit tests before attaching this release asset. Actual VPN reachability can still vary by network and should be checked on the target device.
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
      - name: Publish build summary
        if: always()
        run: |
          {
            echo '### AzadLink build'
            echo '- The pinned Oblivion/Aether and hev-socks5-tunnel source trees are checked out recursively and the upstream Aether Android library is included as a Gradle module.'
            echo '- Native Aether and the TUN bridge are built through the upstream Android library; app-level service adapter and live VPN traffic routing still require integration and device verification.'
            echo '- If release-signing secrets are configured, non-PR branch builds also publish a signed APK as an Actions artifact; version tags additionally attach it to a GitHub Release.'
            echo '- A successful APK build does not by itself mean the VPN tunnel works.'
          } >> "$GITHUB_STEP_SUMMARY"
