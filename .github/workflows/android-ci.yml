name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Keep only the newest build for a branch; cancel superseded runs.
concurrency:
  group: azadlink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install Android platform and NDK
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build Xray gomobile AAR from source (TUN, MASQUE and WireGuard outbound)
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/AndroidLibXrayLite"
          git clone --depth 1 --branch main https://github.com/2dust/AndroidLibXrayLite.git "$src"
          cd "$src"
          mkdir -p "$GITHUB_WORKSPACE/app/libs" "$GITHUB_WORKSPACE/app/src/main/assets/licenses" assets data
          bash gen_assets.sh download
          cp -v data/*.dat assets/
          go mod tidy -v
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" ./
          cp LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/licenses/AndroidLibXrayLite-LICENSE.txt"
          core_dir="$(go list -m -f '{{.Dir}}' github.com/xtls/xray-core)"
          if [[ -f "$core_dir/LICENSE" ]]; then cp "$core_dir/LICENSE" "$GITHUB_WORKSPACE/app/src/main/assets/licenses/Xray-core-MPL-2.0.txt"; fi
          if [[ -f "$core_dir/NOTICE" ]]; then cp "$core_dir/NOTICE" "$GITHUB_WORKSPACE/app/src/main/assets/licenses/Xray-core-NOTICE.txt"; fi
          printf 'Repository: https://github.com/2dust/AndroidLibXrayLite\nBuilt from CI source checkout\n' > "$GITHUB_WORKSPACE/app/src/main/assets/core-runtime-version.txt"
      - name: Build Psiphon ConsoleClient Android executable
        shell: bash
        run: |
          set -euo pipefail
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          src="$RUNNER_TEMP/psiphon-tunnel-core"
          git clone --depth 1 --branch v2.0.41 https://github.com/Psiphon-Labs/psiphon-tunnel-core.git "$src"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/licenses
          (cd "$src" && GOOS=android GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags='-s -w -checklinkname=0' -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libazadlink_psiphon.so" ./ConsoleClient)
          cp "$src/LICENSE" app/src/main/assets/licenses/Psiphon-GPL-3.0.txt
      - name: Build MasterDNS, StormDNS and DNSTT Android executables
        shell: bash
        run: |
          set -euo pipefail
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          out="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$out" app/src/main/assets/licenses
          build_client() {
            local repo="$1" ref="$2" package="$3" name="$4"
            local src="$RUNNER_TEMP/$name"
            git clone --depth 1 --branch "$ref" "$repo" "$src"
            (cd "$src" && GOOS=android GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o "$out/$name.so" "$package")
            if [[ -f "$src/LICENSE" ]]; then cp "$src/LICENSE" "app/src/main/assets/licenses/$name-LICENSE.txt"; fi
          }
          build_client https://github.com/masterking32/MasterDnsVPN.git main ./cmd/client libazadlink_masterdns
          build_client https://github.com/nullroute1970/StormDNS.git main ./cmd/client libazadlink_stormdns
          build_client https://github.com/mahsanet/dnstt.git master ./cmd/dnstt-client libazadlink_dnstt
      - name: Run unit tests and assemble debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: azadlink-debug-apk-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish build summary
        if: always()
        run: |
          {
            echo '### AzadLink multi-engine build'
            echo '- Xray / MASQUE / WireGuard runtime is built from AndroidLibXrayLite source.'
            echo '- Psiphon uses the upstream ConsoleClient as a loopback SOCKS engine.'
            echo '- MasterDNS, StormDNS and DNSTT use their upstream Go clients as loopback TCP engines.'
            echo '- This build is a UI preview only. Engine integration and live VPN traffic routing are not verified.'
          } >> "$GITHUB_STEP_SUMMARY"
